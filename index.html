  <!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
      <title>Product Page</title>
      <link rel="stylesheet" href="style.css">
      <link href='https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css' rel='stylesheet'>
  </head>
  <body>

    <!-- navbar -->
      <nav class="navbar navbar-expand-lg bg-success shadow">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Navbar</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Contact</a>
          </li>
        </ul>
        <form class="d-flex" role="search">
          <input id="search" class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
          <button class="btn" style="color: white; border: solid white 1px;" type="submit">Search</button>
        </form>
      </div>
    </div>
  </nav>

  <!-- Main -->
      <main class="container-sm mt-5">
          <div class="row justify-content-center gap-3">
              <div class="col-11 col-md-8 col-lg-5">
                 <img src="assets/img/product.jpg" class="img-fluid" alt="Green Shoes Thumbnail view">

                <div class="row mt-2 g-2">
                  <div class="col-2">
                    <img src="assets/img/product2.jpeg" class="img-fluid" alt="Green Shoes-2">
                  </div>
                  <div class="col-2">
                     <img src="assets/img/product3.jpeg" class="img-fluid" alt="Green Shoes-3">
                  </div>
                </div>
              </div>

          
              <!-- Detail Section -->
          <section class="col-11 col-md-8 col-lg-4">
            <ol class="breadcrumb mb-0">
                  <li class="breadcrumb-item"><a href="" class="text-decoration-none text-success">Footwear</a></li>
                  <li class="breadcrumb-item active">Sneakers</li>
              </ol>

              <h1 class="display-6 fw-bold">Green Sports Shoes</h1>
              


              <!-- Rating -->
               <div class="text-warning d-flex mb-2">
              <i class='bx bxs-star'></i><i class='bx bxs-star'></i><i class='bx bxs-star'></i> <i class='bx bxs-star'></i> 
                <span class="text-muted ms-2 small mt-1">(124 Reviews)</span>
                </div>

              <div class="d-flex align-items-center gap-3 mb-3">
                <span class="mb-0 h4 mt-2">$50</span>
              <span class="mb-0 mt-2 text-decoration-line-through">$100</span>
              
              <span class="discount-span border d-flex align-items-center border-danger px-2">50% OFF</span>
              </div>
              
              <p>Precision crafted to define the intersection of technology and art.
                The Onyx edition offers an unparalleled tactile experience with seamless connectivity.</p>
                   
                  <span class="fw-bold">Choose Color</span>
                  <br>
                 <button aria-label="Black color" class="color-btn btn btn-outline-dark rounded-circle shadow dark-btn active"></button>
                  <button aria-label="Red color" class="color-btn btn btn-outline-danger rounded-circle shadow red-btn bg-danger"></button>
                  <button aria-label="Blue color" class="color-btn btn btn-outline-primary rounded-circle shadow blue-btn bg-primary"></button>

                  
                  <div class="d-flex align-items-center gap-3 mt-4 mx-4">

                  <label for="quantity" class="form-label mb-0">Quantity</label>
                    <input min="1" max="10" value="1" class="rounded w-25" id="quantity" type="number">
                      <button class="btn btn-success text-nowrap d-flex p-2"><box-icon class="me-2" name='cart' color='#fcfcfc'></box-icon>Add to Cart</button>
                  </div>

        </section>
      </main>
      <!-- Main Section End -->
      
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
       <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
      <script src="script.js"></script>
  </body>

  </html>
